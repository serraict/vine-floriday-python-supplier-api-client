# Fail when Floriday publishes a Supplier API version newer than the one
# this client is generated against. Run on a schedule so a stale client
# surfaces as a failing workflow rather than something a human has to
# remember to check.
name: Check Floriday API version

on:
  schedule:
    # Mondays at 07:00 UTC. Floriday ships roughly twice a year, so a
    # weekly cadence is plenty and keeps Actions usage negligible.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read client API version
        id: client
        run: |
          client_version=$(grep -oE 'EXPECTED_API_VERSION = "[^"]+"' \
            floriday_supplier_client/api_factory.py \
            | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$client_version" ]; then
            echo "::error::Could not parse EXPECTED_API_VERSION from floriday_supplier_client/api_factory.py"
            exit 1
          fi
          echo "Client is on $client_version"
          echo "version=$client_version" >> "$GITHUB_OUTPUT"

      - name: Discover latest Main Floriday Supplier API version
        id: floriday
        # Probe the staging swagger spec for each candidate. Floriday marks
        # each version's lifecycle stage in the spec's `info.title`
        # ("Main - ...", "Alpha/Beta - ...", "Deprecated - ..."). We only
        # care about Main: Alpha/Beta versions are intentionally staged for
        # early adopters and shouldn't force a client bump. Walk candidates
        # in descending order and take the first with a Main-labelled spec.
        run: |
          year=$(date +%Y)
          latest=""
          for candidate in $((year+1))v1 ${year}v3 ${year}v2 ${year}v1 $((year-1))v2; do
            url="https://api.staging.floriday.io/suppliers-api-${candidate}/swagger/UUID/swagger.json"
            title=$(curl -sS --max-time 15 "$url" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("info",{}).get("title",""))' \
              2>/dev/null || true)
            echo "$candidate -> title: '${title}'"
            case "$title" in
              "Main - "*)
                latest="$candidate"
                break
                ;;
            esac
          done
          if [ -z "$latest" ]; then
            echo "::error::Could not determine the latest Main Floriday Supplier API version from any candidate."
            exit 1
          fi
          echo "Latest Main Floriday version: $latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        run: |
          client="${{ steps.client.outputs.version }}"
          latest="${{ steps.floriday.outputs.version }}"
          if [ "$client" != "$latest" ]; then
            echo "::error::Client is generated for $client but Floriday's latest is $latest. Run the /api-client-updater skill to regenerate."
            exit 1
          fi
          echo "Client is up-to-date with Floriday ($client)."
