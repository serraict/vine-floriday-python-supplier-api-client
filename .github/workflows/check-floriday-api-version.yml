# Open a tracking issue when Floriday publishes a Supplier API version newer
# than the one this client is generated against. Runs on a schedule so a stale
# client surfaces as an "Update to <version>" issue (labelled `next`) rather
# than something a human has to remember to check. The run itself stays green
# once the issue exists.
name: Check Floriday API version

on:
  schedule:
    # Mondays at 07:00 UTC. Floriday ships roughly twice a year, so a
    # weekly cadence is plenty and keeps Actions usage negligible.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read client API version
        id: client
        run: |
          client_version=$(grep -oE 'EXPECTED_API_VERSION = "[^"]+"' \
            floriday_supplier_client/api_factory.py \
            | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$client_version" ]; then
            echo "::error::Could not parse EXPECTED_API_VERSION from floriday_supplier_client/api_factory.py"
            exit 1
          fi
          echo "Client is on $client_version"
          echo "version=$client_version" >> "$GITHUB_OUTPUT"

      - name: Discover latest Main Floriday Supplier API version
        id: floriday
        # Probe the staging swagger spec for each candidate. Floriday marks
        # each version's lifecycle stage in the spec's `info.title`
        # ("Main - ...", "Alpha/Beta - ...", "Deprecated - ..."). We only
        # care about Main: Alpha/Beta versions are intentionally staged for
        # early adopters and shouldn't force a client bump. Walk candidates
        # in descending order and take the first with a Main-labelled spec.
        run: |
          year=$(date +%Y)
          latest=""
          for candidate in $((year+1))v1 ${year}v3 ${year}v2 ${year}v1 $((year-1))v2; do
            url="https://api.staging.floriday.io/suppliers-api-${candidate}/swagger/UUID/swagger.json"
            title=$(curl -sS --max-time 15 "$url" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("info",{}).get("title",""))' \
              2>/dev/null || true)
            echo "$candidate -> title: '${title}'"
            case "$title" in
              "Main - "*)
                latest="$candidate"
                break
                ;;
            esac
          done
          if [ -z "$latest" ]; then
            echo "::error::Could not determine the latest Main Floriday Supplier API version from any candidate."
            exit 1
          fi
          echo "Latest Main Floriday version: $latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Open an update issue if the client is behind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          client="${{ steps.client.outputs.version }}"
          latest="${{ steps.floriday.outputs.version }}"
          if [ "$client" = "$latest" ]; then
            echo "Client is up-to-date with Floriday ($client)."
            exit 0
          fi

          echo "Client is on $client but Floriday's latest Main is $latest."
          title="Update to $latest"

          # Make sure the 'next' label exists (idempotent).
          gh label create next --color "0e8a16" \
            --description "Queued as the next thing to work on" 2>/dev/null || true

          # Only open an issue if an open one with this exact title doesn't exist.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$existing" ]; then
            echo "Issue #$existing already tracks \"$title\" - nothing to do."
            exit 0
          fi

          body=$(printf '%s\n' \
            "Floriday published Supplier API $latest as the current Main version, but this client is generated for $client." \
            "" \
            "Run the /api-client-updater skill to regenerate against $latest and write the update guide." \
            "" \
            "- Floriday versions: https://developer.floriday.io/docs/welcome" \
            "- Detected by .github/workflows/check-floriday-api-version.yml")
          gh issue create --title "$title" --label next --body "$body"
          echo "Opened issue \"$title\"."
